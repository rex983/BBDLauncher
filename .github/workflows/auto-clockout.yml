# Every 5 minutes, poke the launcher's auto-clockout endpoint so any
# employee who is past their (scheduled + extension) end time gets a
# clock_out punch backdated to that end time.
#
# Retired as the scheduler on 2026-11-03: GitHub only ran this every 3-6
# hours, so people stayed "clocked in" for hours after their shift. The team
# is on Vercel Pro now and vercel.json runs /api/cron/auto-clockout every
# 5 minutes. Kept as a manual trigger (Actions -> Auto Clockout -> Run).
#
# Setup: repo secret CRON_SECRET (same value as the Vercel env var).

name: Auto Clockout

on:
  workflow_dispatch: {}

concurrency:
  group: auto-clockout
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /api/cron/auto-clockout
        run: |
          set -euo pipefail
          response=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            --write-out '\nHTTP_STATUS:%{http_code}\n' \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://bbd-launcher.vercel.app/api/cron/auto-clockout)
          echo "$response"
          status=$(echo "$response" | tail -1 | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::Expected HTTP 200, got $status"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
